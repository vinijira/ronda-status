# Upptime (https://upptime.js.org) — status page da Ronda Fiscal
# Alvo: /healthz do Simulador (dead-man: responde 503 se o banco não responder em 8 s).
# Até o go-live o alvo é o preview (workers.dev); no 4c do LAUNCH-RUNBOOK trocar para https://rondafiscal.com.br/healthz.
owner: vinijira
repo: ronda-status

sites:
  - name: Simulador Simples 2027
    url: https://simulador-simples.rondafiscal.workers.dev/healthz
    method: GET
    maxResponseTime: 8000

status-website:
  cname: status.rondafiscal.com.br
  name: Ronda Fiscal — status
  introTitle: "Status dos serviços da **Ronda Fiscal**"
  introMessage: Verificação automática a cada 5 minutos. Incidentes aparecem aqui assim que são detectados.
  navbar:
    - title: Status
      href: /
    - title: Simulador
      href: https://rondafiscal.com.br

i18n:
  activeIncidents: Incidentes ativos
  allSystemsOperational: Todos os sistemas operacionais
  incidentReport: "Incidente #$NUMBER"
  liveStatus: Status ao vivo
  overallUptime: "Disponibilidade: $UPTIME"
  pastIncidents: Incidentes anteriores
  pastIncidentsResolved: Resolvido em $MINUTES minutos com $POSTS comentários
  responseTime: "Tempo de resposta: $TIME ms"
  up: Operacional
  down: Fora do ar
  degraded: Degradado
